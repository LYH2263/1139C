name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./backend/gradlew
        working-directory: backend

      - name: Build with Gradle
        run: ./gradlew build -x test
        working-directory: backend

      - name: Run Tests
        run: ./gradlew test
        working-directory: backend

      - name: Generate OpenAPI Spec
        run: |
          ./gradlew bootRun &
          SPRING_PID=$!
          sleep 30
          curl -f http://localhost:8080/v3/api-docs -o openapi.json || echo "Failed to fetch OpenAPI spec"
          kill $SPRING_PID 2>/dev/null || true
        working-directory: backend
        continue-on-error: true

      - name: Upload OpenAPI Spec
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: backend/openapi.json

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npx eslint . --ext .ts,.vue --max-warnings 0
        working-directory: frontend
        continue-on-error: true

      - name: Type Check
        run: npx vue-tsc --noEmit
        working-directory: frontend

      - name: Run Tests
        run: npm run test:run
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  api-check:
    name: API Change Detection
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Download OpenAPI Spec from backend job
        uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: frontend/
        continue-on-error: true

      - name: Check if openapi.json exists
        id: check-spec
        run: |
          if [ -f "frontend/openapi.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate OpenAPI Spec (fallback)
        if: steps.check-spec.outputs.exists == 'false'
        run: |
          echo "⚠️  No OpenAPI spec artifact found, using mock spec for diff check"
          if [ ! -f "frontend/openapi.json" ]; then
            echo '{"openapi":"3.0.1","info":{"title":"WordMind API","version":"1.0.0"},"paths":{},"components":{}}' > frontend/openapi.json
          fi

      - name: Fetch previous OpenAPI spec from base branch
        run: |
          git show ${{ github.base_ref }}:frontend/openapi.json > frontend/openapi-prev.json 2>/dev/null || \
          echo "⚠️  No previous OpenAPI spec found, this is the first PR or base branch doesn't have the spec"

      - name: Run API diff check
        id: api-diff
        run: |
          cd frontend
          if [ -f "openapi-prev.json" ]; then
            npm run api:check
          else
            echo "⚠️  Skipping API diff check - no previous spec for comparison"
            exit 0
          fi
        continue-on-error: false

      - name: Generate TypeScript types
        run: npm run api:types:local
        working-directory: frontend
        continue-on-error: true

  api-types:
    name: Generate API Types
    runs-on: ubuntu-latest
    needs: api-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Generate TypeScript types
        run: npm run api:types:local
        working-directory: frontend
        continue-on-error: true

      - name: Save current spec as baseline
        run: |
          cd frontend
          npm run api:save
        continue-on-error: true
